# mcp.isambane.co.za -> per-developer frappe-lab-mcp processes (supervisor: frappe-lab-mcp-<user>).
#
# Each developer's connector URL in ChatGPT:  https://mcp.isambane.co.za/<user>/mcp
# The user -> port map is generated by `frappe-lab-mcp-admin configure` into
# /etc/frappe-lab-mcp/nginx-users.map and nginx is reloaded for you -- no edits here per user.
#
# If Virtualmin generated the server block for this domain, keep its listen/ssl lines
# and replace everything else inside `server { }` with the locations below
# (drop its `location ^~ /.well-known/` block -- the OAuth discovery paths must reach the app).
# The `map` block must stay OUTSIDE the server block.

map $mcp_user $mcp_port {
    default 0;
    include /etc/frappe-lab-mcp/nginx-users.map;
}

server { }` with the locations below
# (drop its `location ^~ /.well-known/` block -- the OAuth discovery paths must reach the app).
# The `map` block must stay OUTSIDE the server block.

map $mcp_user $mcp_port {
    default 0;
    eben    8710;
    # juan  8711;
    # kosie 8712;
}

server {
    listen 80;
    server_name mcp.isambane.co.za;
    # Keep for certificate renewal, then redirect everything else to HTTPS.
    location ^~ /.well-known/acme-challenge/ { root /home/eben/public_html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name mcp.isambane.co.za;
    ssl_certificate     /etc/ssl/virtualmin/CHANGE_ME/ssl.combined;
    ssl_certificate_key /etc/ssl/virtualmin/CHANGE_ME/ssl.key;

    access_log /var/log/virtualmin/mcp.isambane.co.za_access_log;
    error_log  /var/log/virtualmin/mcp.isambane.co.za_error_log;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = / { return 404; }

    # RFC 9728 protected-resource metadata: /.well-known/oauth-protected-resource/<user>/mcp
    location ~ ^/\.well-known/oauth-protected-resource/(?<mcp_user>[a-z0-9_-]+)(?<mcp_rest>/.*)?$ {
        if ($mcp_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$mcp_port/.well-known/oauth-protected-resource/$mcp_user$mcp_rest;
        proxy_set_header Host $host;
    }

    # RFC 8414 authorization-server metadata for issuer https://mcp.isambane.co.za/<user>
    location ~ ^/\.well-known/oauth-authorization-server/(?<mcp_user>[a-z0-9_-]+)$ {
        if ($mcp_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$mcp_port/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
    }

    # Everything under /<user>/ (mcp, authorize, token, register, login, revoke) -> that user's process
    location ~ ^/(?<mcp_user>[a-z0-9_-]+)(?<mcp_rest>/.*)$ {
        if ($mcp_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$mcp_port$mcp_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP streamable HTTP uses SSE: no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 8m;
    }
}
