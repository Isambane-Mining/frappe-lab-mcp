# Directives for the Virtualmin-managed server block of mcp.isambane.co.za.
# Paste them INSIDE that server { } block (Virtualmin: Web Configuration -> Edit Nginx directives,
# or the site file). Nothing goes in conf.d or anywhere else.
#
# Per-user routing lives in /etc/frappe-lab-mcp/nginx-locations.conf, generated by
# `frappe-lab-mcp-admin configure|remove|nginx` -- one location set per developer:
#   /<user>/...                                         -> 127.0.0.1:<port>/...
#   /.well-known/oauth-protected-resource/<user>/mcp    -> OAuth resource metadata
#   /.well-known/oauth-authorization-server/<user>      -> OAuth server metadata
# Connector URL per developer: https://mcp.isambane.co.za/<user>/mcp
#
# Also change Virtualmin's `location ^~ /.well-known/ { ... }` to
# `location ^~ /.well-known/acme-challenge/ { ... }` so it keeps serving certificate renewals
# without swallowing the OAuth discovery URLs above.

    # Shared proxy settings, inherited by the generated locations (MCP uses SSE: no buffering)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 8m;

    include /etc/frappe-lab-mcp/nginx-locations.conf;
