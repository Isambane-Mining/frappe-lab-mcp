[project]
name = "frappe-lab-mcp"
version = "0.1.0"
description = "MCP connector giving a ChatGPT workspace scoped access to one developer's Frappe lab bench"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.scripts]
frappe-lab-mcp = "frappe_lab_mcp.cli:main"
frappe-lab-mcp-admin = "frappe_lab_mcp.admin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frappe_lab_mcp*"]

[tool.setuptools.package-data]
frappe_lab_mcp = ["runner.py"]
